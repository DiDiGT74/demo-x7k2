<style>

  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1a1d28; --sunk:#222634; --line:#2e3344;

:root[data-theme="dark"]{

  --fg:#e8eaf2; --muted:#a3a9bd; --faint:#7a8096;
  --lagon:#3cc2bb; --lagon-soft:#173a3a; --lilas:#a796ec; --lilas-soft:#2b2647;
  --good:#5cc082; --good-soft:#1c3526; --warn:#e2a64b; --warn-soft:#3a2e17; --crit:#ec7a71; --crit-soft:#402220; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lagon);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.logo b{color:var(--lagon);font-weight:700}

nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--muted);font-weight:600}

.role{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}

.demo{font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;line-height:1.4}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}

.sub{color:var(--muted);margin:2px 0 0}
h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}

.btn.pri{background:var(--lagon);border-color:var(--lagon);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:600;margin-top:4px}
.kpi .d{font-size:12px;color:var(--good);font-weight:600}
.kpi .d.down{color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{background:var(--lilas-soft);color:var(--lilas)}
.p-ok{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-info{background:var(--lagon-soft);color:var(--lagon)}
.p-mute{background:var(--sunk);color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.date{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:78px}
.grow{flex:1;min-width:0}
.ttl{font-weight:600}
.meta{font-size:12px;color:var(--muted)}
/* funnel */
.fun{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:130px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.fb{height:22px;border-radius:6px;background:var(--sunk);overflow:hidden}

.kan{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:12px;padding:10px;min-width:0}
.col h3{font-size:12px;font-weight:700;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--lagon)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.chip{font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 6px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow:auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{border:0;background:var(--sunk);border-radius:8px;width:32px;height:32px;font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.struct{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:12px;line-height:1.7;overflow-x:auto}
.struct b{color:var(--lagon);font-weight:500}
.struct i{color:var(--lilas);font-style:normal}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tli{position:relative;padding:0 0 14px 16px}
.tli::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--lagon)}
.tli.mail::before{border-color:var(--lilas)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--lagon);border-color:var(--lagon)}
/* gantt */
.gantt{min-width:720px}
.gh,.gr{display:grid;grid-template-columns:200px 1fr;align-items:center}
.gh{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:6px}
.months{display:grid;grid-template-columns:repeat(4,1fr)}
.months span{border-left:1px solid var(--line);padding-left:6px}
.gr{border-bottom:1px solid var(--line);min-height:44px}
.gr .nm{font-weight:600;font-size:13px;padding-right:10px}
.gr .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.track{position:relative;height:44px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.bar{position:absolute;top:13px;height:18px;border-radius:5px;background:var(--lagon-soft);border:1.5px solid var(--lagon)}
.bar.l{background:var(--lilas-soft);border-color:var(--lilas)}
.bar .pg{position:absolute;inset:0 auto 0 0;background:var(--lagon);opacity:.55;border-radius:3px}
.bar.l .pg{background:var(--lilas)}
.ms{position:absolute;top:15px;width:12px;height:12px;transform:rotate(45deg);background:var(--warn)}
.today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--crit)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--fg);font:inherit;font-size:13px}
.filters label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.gantt{min-width:900px}
.wk{display:grid;grid-template-columns:repeat(16,1fr)}
.wk span{border-left:1px solid var(--line);padding-left:4px;font-size:10.5px}
.wk span.m{color:var(--fg)}
.track{background:repeating-linear-gradient(90deg,transparent 0 calc(6.25% - 1px),var(--line) calc(6.25% - 1px) 6.25%)}
.gr.click{cursor:pointer}
.gr.click:hover{background:var(--sunk)}
.due{position:absolute;top:8px;bottom:8px;width:0;border-left:2px solid var(--crit)}
.bar.late{border-color:var(--crit)}
.bar.tent{background:none;border-style:dashed;border-color:var(--faint)}
.flag{font-size:11px;font-weight:700;color:var(--crit)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.alert:last-child{border-bottom:0}
.alert .ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px}
.alert .ic.c{background:var(--crit-soft);color:var(--crit)}
.alert .ic.w{background:var(--warn-soft);color:var(--warn)}
.bud{display:flex;flex-direction:column;gap:6px}
.bud .t{position:relative;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.bud .t i{position:absolute;inset:0 auto 0 0;border-radius:7px}
.heat{border-collapse:separate;border-spacing:3px;min-width:900px}
.heat th{border:0;padding:4px;text-align:center;font-size:10.5px}
.heat th:first-child{text-align:left}
.heat td{border:0;padding:0;text-align:center;font-size:11.5px;font-weight:700;height:34px;border-radius:6px;font-variant-numeric:tabular-nums}
.heat td.nm{text-align:left;font-weight:600;font-size:13px;padding-right:10px;white-space:nowrap}
.heat td.nm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.heat td.c{cursor:pointer}
.h0{background:var(--sunk);color:var(--faint)}
.h1{background:var(--good-soft);color:var(--good)}
.h2{background:var(--lagon-soft);color:var(--lagon)}
.h3{background:var(--crit-soft);color:var(--crit);outline:1.5px solid var(--crit)}
.heat td.c:hover{filter:brightness(.95)}
/* bars chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars i{width:100%;max-width:38px;background:var(--lagon);border-radius:5px 5px 0 0}
.bars i.f{background:var(--lilas);opacity:.55}
.bars span{font-size:11px;color:var(--muted)}
.bl{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:6px}
.bl span{display:flex;gap:6px;align-items:center}
.bl i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bl i.h1,.bl i.h2,.bl i.h3{width:14px;height:14px}
/* marketing */
.post{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.post p{margin:0;white-space:pre-line;font-size:13.5px}
.ch{display:flex;gap:6px;flex-wrap:wrap}
.ch button{border:1px solid var(--line);background:none;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.ch button[aria-pressed="true"]{background:var(--lilas-soft);border-color:var(--lilas);color:var(--lilas)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);padding:10px;font:inherit;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;font-size:13px}
.lock{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav button{white-space:nowrap;flex:none}
  nav svg{display:none}
  .role{margin-top:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kv{grid-template-columns:1fr}
  .fr{grid-template-columns:100px 1fr 36px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .2s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
</style>

<div id="gate" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))">

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-prj],[data-cell],[data-go],[data-dem],[data-deal],[data-close],[data-conv],[data-arch],[data-adv],[data-fit],[data-val],[data-regen],[data-ch],[data-act]');
 if(!t)return;
 const ds=t.dataset;
 if(ds.prj)prjDrawer(ds.prj);
 else if(ds.cell){const [r,w]=ds.cell.split('|');cellDrawer(r,w)}
 else if(ds.go!==undefined){closeD();go(ds.go)}
 else if(ds.dem)demDrawer(ds.dem);
 else if(ds.deal)dealDrawer(+ds.deal);
 else if(ds.close!==undefined)closeD();
 else if(ds.conv){const d=S.demandes.find(x=>x.id===ds.conv);d.st='conv';const deal=S.deals.find(x=>x.ent===d.ent);if(deal)deal.st=1;closeD();render();toast('Converti en prospect qualifié')}
 else if(ds.arch){S.demandes.find(x=>x.id===ds.arch).st='arch';closeD();render();toast('Demande archivée')}
 else if(ds.adv){const d=S.deals.find(x=>x.id===+ds.adv);d.st++;render();dealDrawer(d.id);toast(d.st===5?'Signé : projet créé dans le portefeuille':'Statut mis à jour')}
 else if(ds.fit){const f=S.fin[+ds.fit];f.st='Facturé';f.fit='FN-2026-04'+(20+ +ds.fit);render();toast('Facture créée dans Fitnet (démo)')}
 else if(ds.val){S.posts.find(p=>p.id===+ds.val).st='ok';render();toast('Validé : programmé dans Buffer')}
 else if(ds.regen){toast('Nouvelle version générée (démo)')}
 else if(ds.ch){const [id,c]=ds.ch.split('|');S.posts.find(p=>p.id===+id).ch=c;render()}
 else if(ds.act){toast({newrdv:'Rendez-vous créé dans Outlook (démo)',relance:'Relance envoyée (démo)',idea:'Idée ajoutée à la banque (démo)',gen:'Brouillons générés pour 4 canaux (démo)',mail:'Ouverture du mail dans Outlook (démo)',tabdemo:'Onglet disponible dans la version réelle',affect:'Affectation enregistrée (démo)',replan:'Replanification proposée (démo)',lisser:'Lissage proposé : 2 tâches décalées d\'une semaine (démo)'}[ds.act]||'Démo')}
});

 document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();
