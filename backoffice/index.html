.gantt{min-width:720px}

 <div class="acts">${d.st<5?`<button class="btn pri" data-adv="${d.id}">Passer à « ${STAGES[d.st+1]} »</button>`:'<button class="btn pri" data-go="projets">Voir le projet</button>'}<button class="btn" data-act="mail">Écrire un mail</button><button class="btn" data-act="newrdv">Planifier un RDV</button></div>`);
}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-dem],[data-deal],[data-close],[data-conv],[data-arch],[data-adv],[data-fit],[data-val],[data-regen],[data-ch],[data-act]');
 if(!t)return;
 const ds=t.dataset;
 if(ds.go!==undefined){closeD();go(ds.go)}
 else if(ds.dem)demDrawer(ds.dem);
 else if(ds.deal)dealDrawer(+ds.deal);
 else if(ds.close!==undefined)closeD();
 else if(ds.conv){const d=S.demandes.find(x=>x.id===ds.conv);d.st='conv';const deal=S.deals.find(x=>x.ent===d.ent);if(deal)deal.st=1;closeD();render();toast('Converti en prospect qualifié')}
 else if(ds.arch){S.demandes.find(x=>x.id===ds.arch).st='arch';closeD();render();toast('Demande archivée')}
 else if(ds.adv){const d=S.deals.find(x=>x.id===+ds.adv);d.st++;render();dealDrawer(d.id);toast(d.st===5?'Signé : projet créé dans le portefeuille':'Statut mis à jour')}
 else if(ds.fit){const f=S.fin[+ds.fit];f.st='Facturé';f.fit='FN-2026-04'+(20+ +ds.fit);render();toast('Facture créée dans Fitnet (démo)')}
 else if(ds.val){S.posts.find(p=>p.id===+ds.val).st='ok';render();toast('Validé : programmé dans Buffer')}
 else if(ds.regen){toast('Nouvelle version générée (démo)')}
 else if(ds.ch){const [id,c]=ds.ch.split('|');S.posts.find(p=>p.id===+id).ch=c;render()}
 else if(ds.act){toast({newrdv:'Rendez-vous créé dans Outlook (démo)',relance:'Relance envoyée (démo)',idea:'Idée ajoutée à la banque (démo)',gen:'Brouillons générés pour 4 canaux (démo)',mail:'Ouverture du mail dans Outlook (démo)',tabdemo:'Onglet disponible dans la version réelle'}[ds.act]||'Démo')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
document.getElementById('role').addEventListener('change',e=>{S.role=e.target.value;try{localStorage.setItem('sb-role',S.role)}catch(_){}go(cur)});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'accueil');
(function(){const g=document.getElementById('gate');let ok=false;try{ok=sessionStorage.getItem('sb-ok')==='1'}catch(_){}
 if(ok){g.remove();return}
 document.getElementById('gs').addEventListener('click',e=>{const p=document.getElementById('gp'),v=p.type==='password';p.type=v?'text':'password';e.target.textContent=v?'Masquer':'Afficher';e.target.setAttribute('aria-pressed',v)});
 document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();
  if(document.getElementById('gl').value.trim().toLowerCase()==='liacestbien'&&document.getElementById('gp').value.trim()==='liacestmal'){g.remove();try{sessionStorage.setItem('sb-ok','1')}catch(_){}}
  else document.getElementById('ge').hidden=false});})();
</script>
